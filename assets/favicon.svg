<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#030712"/>
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="url(#glowGrad)" stroke-width="1.5" stroke-opacity="0.6"/>
  <!-- Cyber Hexagon Center -->
  <polygon points="32,14 48,23 48,41 32,50 16,41 16,23" stroke="url(#glowGrad)" stroke-width="2" fill="none" filter="url(#neon)"/>
  <!-- Stylized G Monogram -->
  <path d="M38 24 C36 21 32 20 28 22 C23 24 21 29 21 34 C21 40 25 44 31 44 C37 44 41 40 41 35 L31 35" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="32" cy="14" r="2" fill="#06b6d4"/>
  <circle cx="48" cy="41" r="2" fill="#8b5cf6"/>
  <circle cx="16" cy="41" r="2" fill="#10b981"/>
</svg>
