<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <linearGradient id="cyberNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowFilt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="160" cy="160" r="140" fill="url(#haloGlow)"/>

  <!-- Rotating Radar Ring Guides -->
  <circle cx="160" cy="160" r="128" stroke="url(#cyberNeon)" stroke-width="1.5" stroke-dasharray="6 8" stroke-opacity="0.6"/>
  <circle cx="160" cy="160" r="105" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2 6" stroke-opacity="0.4"/>
  <circle cx="160" cy="160" r="148" stroke="#06b6d4" stroke-width="0.8" stroke-dasharray="32 16 8 16" stroke-opacity="0.3"/>

  <!-- Outer Cyber Tech Brackets -->
  <path d="M60 160 L40 160 L32 140" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M260 160 L280 160 L288 180" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 60 L160 40 L180 32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round"/>
  <path d="M160 260 L160 280 L140 288" stroke="#8b5cf6" stroke-width="2" stroke-linecap="round"/>

  <!-- Central Shield / Core -->
  <polygon points="160,50 245,100 245,205 160,255 75,205 75,100" fill="url(#shieldFill)" stroke="url(#cyberNeon)" stroke-width="2.5" filter="url(#glowFilt)"/>

  <!-- Inner Cyber Grid Nodes -->
  <polygon points="160,75 225,115 225,195 160,235 95,195 95,115" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.35" fill="none"/>
  
  <!-- Neural Connectivity Lines -->
  <line x1="160" y1="75" x2="160" y2="135" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="95" y1="195" x2="160" y2="160" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="225" y1="195" x2="160" y2="160" stroke="#06b6d4" stroke-width="1.5"/>

  <!-- Giri Monogram Hero Graphic -->
  <g transform="translate(160, 155) scale(1.15)">
    <!-- Stylized G Core -->
    <path d="M20 -35 C12 -42 -2 -42 -18 -34 C-34 -25 -42 -5 -42 16 C-42 38 -28 54 0 54 C24 54 40 38 40 16 L0 16 L0 2" stroke="url(#cyberNeon)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glowFilt)"/>
    <circle cx="0" cy="2" r="4.5" fill="#06b6d4"/>
    <circle cx="40" cy="16" r="3.5" fill="#8b5cf6"/>
  </g>

  <!-- Node Dots with coordinates -->
  <circle cx="160" cy="50" r="3" fill="#06b6d4"/>
  <circle cx="245" cy="100" r="3" fill="#8b5cf6"/>
  <circle cx="245" cy="205" r="3" fill="#ec4899"/>
  <circle cx="160" cy="255" r="3" fill="#06b6d4"/>
  <circle cx="75" cy="205" r="3" fill="#8b5cf6"/>
  <circle cx="75" cy="100" r="3" fill="#06b6d4"/>

  <!-- Status Pulse Badge -->
  <g transform="translate(160, 275)">
    <rect x="-42" y="-10" width="84" height="20" rx="10" fill="#0f172a" stroke="#06b6d4" stroke-width="1"/>
    <circle cx="-26" cy="0" r="3.5" fill="#10b981"/>
    <text x="-16" y="3.5" fill="#e2e8f0" font-family="monospace" font-size="9" font-weight="700" letter-spacing="1">ONLINE</text>
  </g>
</svg>
